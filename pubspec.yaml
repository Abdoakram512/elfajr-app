name: qout
description: "Qout - Charity Organization Application with MVVM, Cubit, and Firebase RBAC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3

  # Routing
  go_router: ^14.8.1

  # Localization
  easy_localization: ^3.0.7

  # Local Persistence
  shared_preferences: ^2.3.5

  # UI Design System & Micro-interactions
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # QR Code Ecosystem
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
